<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ledger</title>
<style>
  :root{
    --ink:#1c231f;
    --green-900:#1f3b2c;
    --green-800:#264835;
    --green-700:#2f5940;
    --cream:#f3efe4;
    --card:#ffffff;
    --line:#e7e1d2;
    --muted:#8a8578;
    --mint:#e3ede2;
    --mint-ink:#2f5940;
    --danger:#a4432f;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 100px;
    min-height:100vh;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .ledger-name{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .ledger-name h1{
    font-size:26px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .ledger-switch{
    background:none;
    border:none;
    color:var(--muted);
    font-size:14px;
    padding:4px;
  }
  .icon-btn{
    width:38px;height:38px;
    border-radius:var(--radius-pill);
    border:1px solid var(--line);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    color:var(--ink);
    cursor:pointer;
  }

  .tabs{
    display:flex;
    background:var(--card);
    border-radius:var(--radius-pill);
    padding:5px;
    margin-bottom:14px;
    border:1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:11px 0;
    border-radius:var(--radius-pill);
    font-size:15px;
    font-weight:600;
    background:transparent;
    border:none;
    color:var(--ink);
    cursor:pointer;
  }
  .tab.active{
    background:var(--green-800);
    color:#fff;
  }

  .months{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:14px;
    scrollbar-width:none;
  }
  .months::-webkit-scrollbar{display:none;}
  .month-chip{
    flex:0 0 auto;
    padding:10px 18px;
    border-radius:var(--radius-pill);
    border:1px solid var(--line);
    background:var(--card);
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    cursor:pointer;
  }
  .month-chip.active{
    background:var(--green-800);
    color:#fff;
    border-color:var(--green-800);
  }

  .search{
    width:100%;
    padding:14px 16px;
    border-radius:var(--radius-md);
    border:1px solid var(--line);
    background:var(--card);
    font-size:15px;
    margin-bottom:14px;
    color:var(--ink);
  }
  .search::placeholder{color:var(--muted);}

  .filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:16px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:var(--radius-pill);
    border:1px solid var(--line);
    background:var(--card);
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--green-900);
    color:#fff;
    border-color:var(--green-900);
  }

  .totals{
    background:var(--green-900);
    border-radius:var(--radius-lg);
    padding:20px;
    display:flex;
    color:#fff;
    margin-bottom:20px;
  }
  .totals .col{flex:1;}
  .totals .col + .col{
    border-left:1px solid rgba(255,255,255,0.18);
    padding-left:20px;
    margin-left:20px;
  }
  .totals .label{
    font-size:12.5px;
    color:#c9d6ca;
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .totals .value{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  .entries-meta{
    color:var(--muted);
    font-size:14px;
    margin-bottom:12px;
  }

  .entry{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:18px;
    margin-bottom:12px;
    border:1px solid var(--line);
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .entry-check{
    width:22px; height:22px;
    margin-top:2px;
    accent-color:var(--green-800);
    flex-shrink:0;
  }
  .entry-body{ flex:1; min-width:0; }
  .selection-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:var(--green-900);
    color:#fff;
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:14px;
    font-size:14px;
    font-weight:600;
  }
  .selection-bar.show{ display:flex; }
  .selection-bar button{
    background:#fff;
    color:var(--green-900);
    border:none;
    border-radius:10px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
  }
  .selection-bar .clear-link{
    background:none;
    color:#cfe0d0;
    font-weight:600;
    text-decoration:underline;
    padding:8px 6px;
  }
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:4px;
  }
  .entry-name{
    font-size:19px;
    font-weight:700;
  }
  .entry-amount{
    font-size:19px;
    font-weight:700;
  }
  .entry-sub{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:14px;
    font-weight:400;
    margin-bottom:12px;
  }
  .entry-profit{
    color:var(--green-700);
    font-weight:600;
  }
  .entry-tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .tag{
    background:var(--mint);
    color:var(--mint-ink);
    font-size:13px;
    font-weight:600;
    padding:7px 12px;
    border-radius:var(--radius-pill);
  }
  .tag.unpaid{
    background:#f3e3df;
    color:var(--danger);
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:15px;
    line-height:1.5;
  }

  .fab{
    position:fixed;
    bottom:28px;
    right:50%;
    transform:translateX(240px);
    width:58px;height:58px;
    border-radius:50%;
    background:var(--green-800);
    color:#fff;
    border:none;
    font-size:28px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(31,59,44,0.35);
    cursor:pointer;
  }
  @media (max-width:480px){
    .fab{ right:24px; transform:none; }
  }

  /* modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,24,20,0.45);
    display:none;
    align-items:flex-end;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--cream);
    width:100%;
    max-width:480px;
    margin:0 auto;
    border-radius:24px 24px 0 0;
    padding:22px 18px 26px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    margin:0 0 16px;
    font-size:20px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  .field input, .field select{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
  }
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .checks{display:flex; gap:10px; margin-bottom:6px;}
  .check-chip{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--card);
    text-align:center;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .check-chip.on{
    background:var(--mint);
    border-color:var(--green-700);
    color:var(--mint-ink);
  }
  .item-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .item-row input{
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:14px;
    color:var(--ink);
    font-family:inherit;
  }
  .item-row .item-desc{ flex:2; min-width:0; }
  .item-row .item-qty{ width:52px; text-align:center; }
  .item-row .item-price{ width:72px; text-align:right; }
  .item-row .item-line-total{
    width:72px;
    text-align:right;
    font-size:13px;
    font-weight:600;
    color:var(--green-700);
    flex-shrink:0;
  }
  .item-row .item-remove{
    width:24px; height:24px;
    border-radius:50%;
    border:none;
    background:#f3e3df;
    color:var(--danger);
    font-size:14px;
    line-height:1;
    flex-shrink:0;
    cursor:pointer;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    padding:15px;
    border-radius:14px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--green-800); color:#fff;}
  .btn-secondary{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn-danger{background:#fff; color:var(--danger); border:1px solid #ecd3cc;}

  .switcher-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--card);
    margin-bottom:10px;
    cursor:pointer;
  }
  .switcher-item.active{
    border-color:var(--green-700);
    background:var(--mint);
  }
  .switcher-name{font-weight:700; font-size:15px;}
  .switcher-del{
    color:var(--danger);
    font-size:13px;
    font-weight:600;
    background:none;
    border:none;
    padding:6px;
  }
  .status-msg{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:8px 0 0;
  }
  .invoice-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 8px;
    border-bottom:1px solid var(--line);
  }
  .invoice-row:last-child{ border-bottom:none; }
  .invoice-row input[type="checkbox"]{
    width:20px; height:20px;
    accent-color:var(--green-800);
    flex-shrink:0;
  }
  .invoice-row .invoice-info{
    flex:1;
    font-size:13.5px;
    font-weight:600;
  }
  .invoice-row .invoice-amount{
    font-size:13.5px;
    font-weight:700;
    color:var(--green-700);
  }
  .dialog-overlay{
    position:fixed; inset:0;
    background:rgba(20,24,20,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }
  .dialog-overlay.show{display:flex;}
  .dialog-box{
    background:var(--cream);
    border-radius:20px;
    padding:22px;
    width:100%;
    max-width:340px;
  }
  .dialog-box p{
    margin:0 0 18px;
    font-size:15px;
    line-height:1.5;
    color:var(--ink);
  }
  .dialog-actions{
    display:flex;
    gap:10px;
  }
  .dialog-actions.stacked{
    flex-direction:column;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="ledger-name">
      <h1 id="ledgerTitle">Ledger</h1>
      <button class="ledger-switch" onclick="openSwitcher()">▾</button>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" onclick="openStatement()" title="Generate statement">📄</button>
      <button class="icon-btn" onclick="openSwitcher()" title="Switch ledger">☰</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabLedger" onclick="setView('ledger')">Ledger</button>
    <button class="tab" id="tabYearly" onclick="setView('yearly')">Yearly summary</button>
  </div>

  <div id="ledgerView">
    <div class="months" id="monthRow"></div>

    <input class="search" id="searchInput" placeholder="Search dealer or invoice number" oninput="render()">

    <div class="filters" id="filterRow">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-chip" data-filter="dealer_unpaid" onclick="setFilter('dealer_unpaid')">Dealer unpaid</button>
      <button class="filter-chip" data-filter="dealer_paid" onclick="setFilter('dealer_paid')">Dealer paid</button>
      <button class="filter-chip" data-filter="com_unpaid" onclick="setFilter('com_unpaid')">Com unpaid</button>
      <button class="filter-chip" data-filter="com_paid" onclick="setFilter('com_paid')">Com paid</button>
    </div>

    <div class="totals">
      <div class="col">
        <div class="label">TOTAL INVOICED</div>
        <div class="value" id="totalInvoiced">RM 0</div>
      </div>
      <div class="col">
        <div class="label">TOTAL PROFIT</div>
        <div class="value" id="totalProfit">RM 0</div>
      </div>
    </div>

    <div class="entries-meta" id="entriesMeta">0 entries</div>
    <div class="selection-bar" id="selectionBar">
      <span id="selectionCount">0 selected</span>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="clear-link" onclick="clearEntrySelection()">Clear</button>
        <button onclick="generateStatementFromSelection()">Make statement</button>
      </div>
    </div>
    <div id="entriesList"></div>
  </div>

  <div id="yearlyView" style="display:none;">
    <div id="yearlyList"></div>
  </div>

</div>

<button class="fab" onclick="openEntryForm()">+</button>

<!-- Add/Edit Entry Sheet -->
<div class="overlay" id="entryOverlay">
  <div class="sheet">
    <h2 id="entryFormTitle">Add entry</h2>
    <div class="field">
      <label>Dealer name</label>
      <input id="fDealer" placeholder="e.g. Pc planet" autocomplete="off" autocorrect="off" name="dealer-name-field">
    </div>
    <div class="row2">
      <div class="field">
        <label>Invoice number</label>
        <input id="fInvoice" placeholder="Sv0626-001" autocomplete="off" autocorrect="off">
      </div>
      <div class="field">
        <label>Date</label>
        <input id="fDate" type="date" onchange="autofillInvoiceNumber()">
      </div>
    </div>

    <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600;">Items (optional)</label>
    <div id="itemsHeader" style="display:none; gap:8px; font-size:11px; color:var(--muted); font-weight:600; padding:0 2px 4px;">
      <div style="flex:2;">Description</div>
      <div style="width:52px; text-align:center;">Qty</div>
      <div style="width:72px; text-align:right;">Unit price</div>
      <div style="width:72px; text-align:right;">Total</div>
      <div style="width:24px;"></div>
    </div>
    <div id="itemRowsContainer" style="margin-bottom:8px;"></div>
    <button type="button" class="btn btn-secondary" style="width:100%; margin-bottom:16px;" onclick="addItemRow()">+ Add item</button>

    <div class="row2">
      <div class="field">
        <label>Invoiced amount (RM)</label>
        <input id="fAmount" type="number" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <label>Profit (RM)</label>
        <input id="fProfit" type="number" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600;">Status</label>
    <div class="checks">
      <div class="check-chip" id="chipDealerPaid" onclick="toggleChip('dealerPaid')">Dealer paid</div>
      <div class="check-chip" id="chipComPaid" onclick="toggleChip('comPaid')">Com paid</div>
    </div>
    <div class="row2" style="margin-bottom:14px;">
      <div class="field" id="dealerPaidDateField" style="display:none; margin-bottom:0;">
        <label>Dealer paid date</label>
        <input id="fDealerPaidDate" type="date">
      </div>
      <div class="field" id="comPaidDateField" style="display:none; margin-bottom:0;">
        <label>Com paid date</label>
        <input id="fComPaidDate" type="date">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeEntryForm()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save</button>
    </div>
    <button class="btn btn-danger" id="deleteBtn" style="margin-top:10px;display:none;width:100%;" onclick="deleteEntry()">Delete entry</button>
  </div>
</div>

<!-- Ledger switcher sheet -->
<div class="overlay" id="switcherOverlay">
  <div class="sheet">
    <h2>Your ledgers</h2>
    <div id="switcherList"></div>
    <div class="field" style="margin-top:6px;">
      <label>New ledger name</label>
      <input id="newLedgerName" placeholder="e.g. Personal expenses">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeSwitcher()">Close</button>
      <button class="btn btn-primary" onclick="createLedger()">Create ledger</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="exportBackup()">Backup to file</button>
      <button class="btn btn-secondary" onclick="document.getElementById('restoreFile').click()">Restore from file</button>
    </div>
    <input type="file" id="restoreFile" accept="application/json" style="display:none;" onchange="importBackup(event)">
    <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="renumberInvoices()">Renumber invoices</button>
    <div class="status-msg" id="storageStatus"></div>
  </div>
</div>

<!-- Company / bank info sheet -->
<div class="overlay" id="companyOverlay">
  <div class="sheet">
    <h2>Letterhead &amp; bank details</h2>
    <div class="field">
      <label>Company name</label>
      <input id="ciName">
    </div>
    <div class="field">
      <label>Registration number</label>
      <input id="ciRegNo">
    </div>
    <div class="field">
      <label>Address line 1</label>
      <input id="ciAddr1">
    </div>
    <div class="field">
      <label>Address line 2</label>
      <input id="ciAddr2">
    </div>
    <div class="row2">
      <div class="field">
        <label>Phone</label>
        <input id="ciPhone">
      </div>
      <div class="field">
        <label>Fax</label>
        <input id="ciFax">
      </div>
    </div>
    <div class="field">
      <label>Email</label>
      <input id="ciEmail">
    </div>
    <div class="field">
      <label>Bank account name</label>
      <input id="ciBankAccName">
    </div>
    <div class="row2">
      <div class="field">
        <label>Bank name</label>
        <input id="ciBankName">
      </div>
      <div class="field">
        <label>Account number</label>
        <input id="ciBankAccNo">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="closeCompanyInfo()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCompanyInfo()">Save</button>
    </div>
  </div>
</div>

<!-- Statement Sheet -->
<div class="overlay" id="statementOverlay">
  <div class="sheet">
    <h2>Dealer statement</h2>
    <div class="field">
      <label>Dealer</label>
      <select id="stDealer" onchange="onDealerChange()"></select>
    </div>
    <div class="field">
      <label>Period</label>
      <select id="stPeriod" onchange="onPeriodChange()">
        <option value="all">All time</option>
      </select>
    </div>
    <div class="field">
      <label>Select invoices to include</label>
      <div id="stInvoiceList" style="max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); padding:6px;"></div>
    </div>
    <button class="ledger-switch" id="toggleCustomerDetailsBtn" style="text-align:left; padding:0 0 10px; font-size:14px; text-decoration:underline;" onclick="toggleCustomerDetails()">Customer &amp; statement details</button>
    <div id="customerDetailsFields" style="display:none;">
      <div class="field">
        <label>Customer address (line 1)</label>
        <input id="stCustAddr1" oninput="renderStatementPreview()" placeholder="e.g. 12, Jalan Kundang 2,">
      </div>
      <div class="field">
        <label>Customer address (line 2)</label>
        <input id="stCustAddr2" oninput="renderStatementPreview()" placeholder="e.g. 83000 Batu Pahat, Johor">
      </div>
      <div class="row2">
        <div class="field">
          <label>Attention</label>
          <input id="stAttention" oninput="renderStatementPreview()" placeholder="e.g. Ms Koh">
        </div>
        <div class="field">
          <label>Customer account no.</label>
          <input id="stAccountNo" oninput="renderStatementPreview()" placeholder="e.g. 300-D0001">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Sales executive</label>
          <input id="stSalesExec" oninput="renderStatementPreview()" placeholder="e.g. William">
        </div>
        <div class="field">

// --- Global error surface: never fail silently again ---
function showGlobalError(msg){
  let banner = document.getElementById('globalErrorBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'globalErrorBanner';
    banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7a2e20;color:#fff;padding:12px 16px;font-size:13px;z-index:99999;line-height:1.4;';
    document.body.appendChild(banner);
  }
  banner.textContent = 'Something went wrong: ' + msg + ' (tap to dismiss)';
  banner.onclick = ()=> banner.remove();
}
window.addEventListener('error', function(e){
  const loc = (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : '');
  const stack = e.error && e.error.stack ? ' | ' + e.error.stack.split('\n').slice(0,3).join(' > ') : '';
  showGlobalError((e.message || 'unknown script error') + loc + stack);
});
window.addEventListener('unhandledrejection', function(e){
  const reason = e.reason;
  const stack = reason && reason.stack ? ' | ' + reason.stack.split('\n').slice(0,3).join(' > ') : '';
  showGlobalError((reason && reason.message ? reason.message : String(reason)) + stack);
});

// --- Custom dialog (replaces alert/confirm, which sandboxed previews can block) ---
function showDialog(message, buttons){
  document.getElementById('dialogMessage').textContent = message;
  const actions = document.getElementById('dialogActions');
  actions.innerHTML = '';
  actions.className = 'dialog-actions' + (buttons.length > 2 ? ' stacked' : '');
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.style || 'btn-secondary');
    btn.textContent = b.label;
    btn.onclick = ()=>{
      document.getElementById('dialogOverlay').classList.remove('show');
      if(b.onClick) b.onClick();
    };
    actions.appendChild(btn);
  });
  document.getElementById('dialogOverlay').classList.add('show');
}
function showAlert(message){
  showDialog(message, [{label:'OK', style:'btn-primary'}]);

function showConfirm(message, onConfirm){

function numberToWordsMYR(amount){
  const ones = ['', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE',
    'TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];
  const tens = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY'];
  function threeDigits(n){
    let s = '';
    if(n >= 100){
      s += ones[Math.floor(n/100)] + ' HUNDRED';
      n = n % 100;
      if(n > 0) s += ' AND ';
    }
    if(n >= 20){
      s += tens[Math.floor(n/10)];
      if(n % 10 > 0) s += '-' + ones[n % 10];
    }else if(n > 0){
      s += ones[n];
    }
    return s;
  }
  function toWords(n){
    if(n === 0) return 'ZERO';
    const units = ['', ' THOUSAND', ' MILLION', ' BILLION'];
    let parts = [];
    let unitIndex = 0;
    while(n > 0){
      const chunk = n % 1000;
      if(chunk > 0){
        parts.unshift(threeDigits(chunk) + units[unitIndex]);
      }
      n = Math.floor(n / 1000);
      unitIndex++;
    }
    return parts.join(' ');
  }
  const whole = Math.floor(Math.round((amount || 0) * 100) / 100);
  return toWords(whole) + ' ONLY';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;

function pad2(n){ return String(n).padStart(2,'0'); }
function pad3(n){ return String(n).padStart(3,'0'); }

function computeInvoiceNumber(dateStr){
  const d = new Date(dateStr);
  const mm = pad2(d.getMonth()+1);
  const yy = pad2(d.getFullYear() % 100);
  const prefix = `SV${mm}${yy}-`;
  const ledger = currentLedger();
  let maxSeq = 0;
  ledger.entries.forEach(e=>{
    const match = /^SV(\d{2})(\d{2})-(\d{3})$/i.exec((e.invoice||'').trim());
    if(match && match[1] === mm && match[2] === yy){
      maxSeq = Math.max(maxSeq, parseInt(match[3], 10));
    }
  });
  return prefix + pad3(maxSeq + 1);
}

function autofillInvoiceNumber(){
  // Only auto-generate for new entries; don't overwrite a saved invoice while editing.
  if(state.editingEntryId) return;
  const dateVal = document.getElementById('fDate').value;
  if(!dateVal) return;
  document.getElementById('fInvoice').value = computeInvoiceNumber(dateVal);

function addItemRow(item){
  const container = document.getElementById('itemRowsContainer');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <input type="text" class="item-desc" placeholder="Item description" value="${item && item.description ? escapeHtml(item.description) : ''}" oninput="recalcItems()">
    <input type="number" class="item-qty" placeholder="1" inputmode="decimal" value="${item && item.qty ? item.qty : 1}" oninput="recalcItems()">
    <input type="number" class="item-price" placeholder="0" inputmode="decimal" value="${item && item.unitPrice ? item.unitPrice : ''}" oninput="recalcItems()">
    <div class="item-line-total">0.00</div>
    <button type="button" class="item-remove" onclick="removeItemRow(this)">×</button>
  `;
  container.appendChild(row);
  recalcItems();
}

function removeItemRow(btn){
  btn.closest('.item-row').remove();
  recalcItems();
}

function getItemRowsData(){
  const rows = document.querySelectorAll('#itemRowsContainer .item-row');
  return Array.from(rows).map(row=>({
    description: row.querySelector('.item-desc').value.trim(),
    qty: parseFloat(row.querySelector('.item-qty').value) || 0,
    unitPrice: parseFloat(row.querySelector('.item-price').value) || 0,
  })).filter(it => it.description || it.qty || it.unitPrice);
}

function recalcItems(){
  const rows = document.querySelectorAll('#itemRowsContainer .item-row');
  const header = document.getElementById('itemsHeader');
  header.style.display = rows.length > 0 ? 'flex' : 'none';

  let total = 0;
  rows.forEach(row=>{
    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
    const price = parseFloat(row.querySelector('.item-price').value) || 0;
    const lineTotal = qty * price;
    row.querySelector('.item-line-total').textContent = lineTotal.toFixed(2);
    total += lineTotal;
  });

  const amountField = document.getElementById('fAmount');
  if(rows.length > 0){
    amountField.value = total.toFixed(2);
    amountField.readOnly = true;
    amountField.style.background = '#f0efe9';
  }else{
    amountField.readOnly = false;
    amountField.style.background = '';
  }
}

function updateSelectionBar(){

}

function openEntryForm(entryId){
  state.editingEntryId = entryId || null;
  const overlay = document.getElementById('entryOverlay');
  overlay.classList.add('show');
  document.getElementById('deleteBtn').style.display = entryId ? 'block' : 'none';

  document.getElementById('itemRowsContainer').innerHTML = '';
  document.getElementById('fAmount').readOnly = false;
  document.getElementById('fAmount').style.background = '';

  if(entryId){
    const e = currentLedger().entries.find(x=>x.id===entryId);
    document.getElementById('entryFormTitle').textContent = 'Edit entry';
    document.getElementById('fDealer').value = e.dealer;
    document.getElementById('fInvoice').value = e.invoice;
    document.getElementById('fDate').value = e.date.slice(0,10);
    document.getElementById('fAmount').value = e.amount;
    document.getElementById('fProfit').value = e.profit;
    state.chipDealerPaid = !!e.dealerPaid;
    state.chipComPaid = !!e.comPaid;
    document.getElementById('fDealerPaidDate').value = e.dealerPaidDate ? e.dealerPaidDate.slice(0,10) : new Date().toISOString().slice(0,10);
    document.getElementById('fComPaidDate').value = e.comPaidDate ? e.comPaidDate.slice(0,10) : new Date().toISOString().slice(0,10);
    if(e.items && e.items.length){
      e.items.forEach(item => addItemRow(item));
    }
  }else{
    document.getElementById('entryFormTitle').textContent = 'Add entry';
    document.getElementById('fDealer').value = '';
    document.getElementById('fInvoice').value = '';
    document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('fAmount').value = '';
    document.getElementById('fProfit').value = '';
    state.chipDealerPaid = false;
    state.chipComPaid = false;
    document.getElementById('fDealerPaidDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('fComPaidDate').value = new Date().toISOString().slice(0,10);
    autofillInvoiceNumber();
  }
  recalcItems();
  updateChipUI();
}

function toggleChip(which){
  const key = which === 'dealerPaid' ? 'chipDealerPaid' : 'chipComPaid';
  state[key] = !state[key];

function updateChipUI(){
  document.getElementById('chipDealerPaid').classList.toggle('on', state.chipDealerPaid);
  document.getElementById('chipComPaid').classList.toggle('on', state.chipComPaid);
  document.getElementById('dealerPaidDateField').style.display = state.chipDealerPaid ? 'block' : 'none';
  document.getElementById('comPaidDateField').style.display = state.chipComPaid ? 'block' : 'none';
}
async function saveEntry(){
  const dealer = document.getElementById('fDealer').value.trim();
  const invoice = document.getElementById('fInvoice').value.trim();
  const date = document.getElementById('fDate').value;
  const amount = document.getElementById('fAmount').value;
  const profit = document.getElementById('fProfit').value;
  if(!dealer || !date || !amount){
    showAlert('Please fill in dealer name, date, and amount.');
    return;
  }
  const ledger = currentLedger();
  const dealerPaidDate = state.chipDealerPaid ? document.getElementById('fDealerPaidDate').value : null;
  const comPaidDate = state.chipComPaid ? document.getElementById('fComPaidDate').value : null;
  const items = getItemRowsData();
  if(state.editingEntryId){
    const e = ledger.entries.find(x=>x.id===state.editingEntryId);
    Object.assign(e, {dealer, invoice, date, amount, profit, dealerPaid: state.chipDealerPaid, comPaid: state.chipComPaid, dealerPaidDate, comPaidDate, items});
  }else{
    ledger.entries.push({
      id: uid('entry'), dealer, invoice, date, amount, profit,
      dealerPaid: state.chipDealerPaid, comPaid: state.chipComPaid,
      dealerPaidDate, comPaidDate, items
    });
  }

  const saveBtn = document.querySelector('#entryOverlay .btn-primary');
  const originalLabel = saveBtn ? saveBtn.textContent : '';
  if(saveBtn){ saveBtn.textContent = 'Saving…'; saveBtn.disabled = true; }

  try{
    // Don't let a stuck/slow save hang the UI forever — proceed locally after a timeout.
    await Promise.race([
      persist(),
      new Promise(resolve => setTimeout(resolve, 6000))
    ]);
  }catch(err){
    setStatus('Could not save to cloud storage, but kept locally on this device.');
  }finally{
    if(saveBtn){ saveBtn.textContent = originalLabel; saveBtn.disabled = false; }
  }
  closeEntryForm();
  render();
}
function deleteEntry(){
  showConfirm('Delete this entry?', async ()=>{
    const ledger = currentLedger();
    ledger.entries = ledger.entries.filter(x=>x.id !== state.editingEntryId);
    await persist();
    closeEntryForm();
    render();
  });
}

function closeSwitcher(){
  document.getElementById('switcherOverlay').classList.remove('show');
}
function renderSwitcher(){
  const list = document.getElementById('switcherList');
  list.innerHTML = '';
  Object.keys(state.ledgers).forEach(id=>{
    const l = state.ledgers[id];
    const item = document.createElement('div');
    item.className = 'switcher-item' + (id===state.currentLedgerId ? ' active':'');
    const canDelete = Object.keys(state.ledgers).length > 1;
    item.innerHTML = `
      <div class="switcher-name">${escapeHtml(l.name)}</div>
      ${canDelete ? '<button class="switcher-del">Delete</button>' : ''}
    `;
    item.onclick = (ev)=>{
      if(ev.target.classList.contains('switcher-del')) return;
      state.currentLedgerId = id;
      persist();
      closeSwitcher();
      render();
    };
    if(canDelete){
      item.querySelector('.switcher-del').onclick = (ev)=>{
        ev.stopPropagation();
        showConfirm(`Delete "${l.name}" and all its entries?`, async ()=>{
          delete state.ledgers[id];
          if(state.currentLedgerId === id){
            state.currentLedgerId = Object.keys(state.ledgers)[0];
          }
          await persist();
          renderSwitcher();
          render();
        });
      };
    }
    list.appendChild(item);
  });
}
async function createLedger(){
  const nameInput = document.getElementById('newLedgerName');
  const name = nameInput.value.trim() || 'New ledger';
  const id = uid('ledger');
  state.ledgers[id] = { name, entries: [] };
  state.currentLedgerId = id;
  nameInput.value = '';
  await persist();
  closeSwitcher();
  render();
}

function renumberInvoices(){
  const ledger = currentLedger();
  if(!ledger.entries.length){
    setStatus('No entries to renumber.');
    return;
  }
  showConfirm('Renumber every invoice in this ledger in date order, filling any gaps? This cannot be undone.', async ()=>{
    // Group entries by month/year of their invoice date
    const groups = {};
    ledger.entries.forEach(e=>{
      const d = new Date(e.date);
      const key = d.getFullYear() + '-' + pad2(d.getMonth()+1);
      if(!groups[key]) groups[key] = [];
      groups[key].push(e);
    });
    Object.keys(groups).forEach(key=>{
      const [yyyy, mm] = key.split('-');
      const yy = pad2(Number(yyyy) % 100);
      groups[key]
        .sort((a,b)=> new Date(a.date) - new Date(b.date))
        .forEach((entry, idx)=>{
          entry.invoice = `SV${mm}${yy}-${pad3(idx+1)}`;
        });
    });
    await persist();
    closeSwitcher();
    render();
    setStatus('Invoice numbers refreshed.');
  });
}

function exportBackup(){
  const payload = {
    ledgers: state.ledgers,
    currentLedgerId: state.currentLedgerId,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const stamp = new Date().toISOString().slice(0,10);
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ledger-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus('Backup downloaded.');
  }catch(e){
    setStatus('Could not download the backup file.');
  }
}

async function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.ledgers || typeof data.ledgers !== 'object'){
      throw new Error('Invalid file');
    }
    event.target.value = '';
    showDialog('Merge this backup with your current ledgers, or replace everything with the backup?', [
      {label:'Cancel', style:'btn-secondary'},
      {label:'Replace all', style:'btn-danger', onClick: async ()=>{
        state.ledgers = data.ledgers;
        state.currentLedgerId = data.currentLedgerId || Object.keys(data.ledgers)[0];
        await persist();
        closeSwitcher();
        render();
        setStatus('Restore complete.');
      }},
      {label:'Merge', style:'btn-primary', onClick: async ()=>{
        Object.keys(data.ledgers).forEach(id=>{
          if(state.ledgers[id]){
            const existingIds = new Set(state.ledgers[id].entries.map(e=>e.id));
            data.ledgers[id].entries.forEach(e=>{
              if(!existingIds.has(e.id)) state.ledgers[id].entries.push(e);
            });
          }else{
            state.ledgers[id] = data.ledgers[id];
          }
        });
        await persist();
        closeSwitcher();
        render();
        setStatus('Restore complete.');
      }}
    ]);
  }catch(e){
    setStatus('Could not read that backup file.');
  }
}

// Builds the running-balance transaction list (debits = invoices, credits = grouped payments)
function computeStatementTransactions(entries){
  const debitRows = entries.map(e => ({
    date: e.date,
    reference: e.invoice || '',
    description: 'Sales',
    debit: Number(e.amount) || 0,
    credit: 0,
  }));

  const paymentGroups = {};
  entries.forEach(e=>{
    if(e.dealerPaid && e.dealerPaidDate){
      const key = e.dealerPaidDate.slice(0,10);
      paymentGroups[key] = (paymentGroups[key] || 0) + (Number(e.amount) || 0);
    }
  });
  const creditRows = Object.keys(paymentGroups).map(dateKey => ({
    date: dateKey,
    reference: '',
    description: 'Payment For Account',
    debit: 0,
    credit: paymentGroups[dateKey],
  }));

  const all = debitRows.concat(creditRows).sort((a,b)=> new Date(a.date) - new Date(b.date));
  let balance = 0;
  all.forEach(row=>{
    balance += row.debit - row.credit;
    row.balance = balance;
  });
  const totalDebit = debitRows.reduce((s,r)=>s+r.debit,0);
  const totalCredit = creditRows.reduce((s,r)=>s+r.credit,0);
  return { rows: all, totalDebit, totalCredit, debitCount: debitRows.length, creditCount: creditRows.length, closingBalance: balance };
}

// Last 6 months of total invoiced amount for this dealer, across the whole ledger (not just the current selection)
function computeMonthlySummary(entries){
  const totals = {};
  entries.forEach(e=>{
    const k = monthKey(e.date);
    totals[k] = (totals[k] || 0) + (Number(e.amount) || 0);
  });
  const keys = Object.keys(totals).sort((a,b)=> b.localeCompare(a)).slice(0,6);
  return keys.map(k=>{
    const [y,m] = k.split('-').map(Number);
    const label = new Date(y, m-1, 1).toLocaleString('en-US',{month:'short'}) + ' ' + y;
    return { label, total: totals[k] };
  });
}

async function generateStatementPDF(mode){
  try{
  if(typeof window.jspdf === 'undefined'){
    showStatementStatus('PDF library failed to load. Please check your internet connection and reopen this ledger, then try again.');
    return;
  }
  const dealer = document.getElementById('stDealer').value;
  if(!dealer){
    showStatementStatus('No dealer selected.');
    return;
  }
  const entries = getStatementEntries();
  if(entries.length === 0){
    showStatementStatus('No invoices selected. Tick at least one invoice above.');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const marginX = 40;
  const rightX = pageWidth - marginX;
  let y = 50;
  const ci = state.companyInfo;
  const meta = readStatementMeta();

  // Persist this dealer's profile fields for next time
  await saveDealerProfile(dealer, {
    addr1: meta.addr1, addr2: meta.addr2, attention: meta.attention,
    accountNo: meta.accountNo, salesExec: meta.salesExec, currency: meta.currency, terms: meta.terms
  });

  const { rows, totalDebit, totalCredit, debitCount, creditCount, closingBalance } = computeStatementTransactions(entries);
  const monthly = computeMonthlySummary(entries);

  // Letterhead
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.text((ci.name || '') + (ci.regNo ? '  (' + ci.regNo + ')' : ''), marginX, y);
  y += 16;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(60,60,60);
  if(ci.addressLine1){ doc.text(ci.addressLine1, marginX, y); y += 12; }
  if(ci.addressLine2){ doc.text(ci.addressLine2, marginX, y); y += 12; }
  const contactBits = [];
  if(ci.phone) contactBits.push(`Phone: ${ci.phone}`);
  if(ci.fax) contactBits.push(`Fax: ${ci.fax}`);
  if(contactBits.length){ doc.text(contactBits.join('   '), marginX, y); y += 12; }
  if(ci.email){ doc.text(`Email: ${ci.email}`, marginX, y); y += 12; }

  y += 6;
  doc.setDrawColor(20,20,20);
  doc.setLineWidth(1);
  doc.line(marginX, y, rightX, y);
  y += 18;

  // Customer block (left) + Statement of Account box (right)
  const boxTop = y;
  const boxW = 220;
  const boxX = rightX - boxW;
  doc.setTextColor(20,20,20);
  doc.setFontSize(8.5);
  doc.setFont('helvetica','normal');
  doc.text('Customer', marginX, y);
  y += 12;
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text(dealer, marginX, y);
  y += 13;
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  if(meta.addr1){ doc.text(meta.addr1, marginX, y); y += 12; }
  if(meta.addr2){ doc.text(meta.addr2, marginX, y); y += 12; }

  doc.setDrawColor(20,20,20);
  doc.setLineWidth(0.75);
  doc.rect(boxX, boxTop - 10, boxW, 74);
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('Statement of Account', boxX + boxW/2, boxTop + 6, {align:'center'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.text(`Total Debit (${debitCount})`, boxX + 8, boxTop + 22);
  doc.text(totalDebit.toLocaleString('en-US',{minimumFractionDigits:2}), boxX + boxW - 8, boxTop + 22, {align:'right'});
  doc.text(`Total Credit (${creditCount})`, boxX + 8, boxTop + 36);
  doc.text(totalCredit.toLocaleString('en-US',{minimumFractionDigits:2}), boxX + boxW - 8, boxTop + 36, {align:'right'});
  doc.line(boxX + 6, boxTop + 44, boxX + boxW - 6, boxTop + 44);
  doc.setFont('helvetica','bold');
  doc.text('Closing Balance', boxX + 8, boxTop + 58);
  doc.text(closingBalance.toLocaleString('en-US',{minimumFractionDigits:2}), boxX + boxW - 8, boxTop + 58, {align:'right'});

  y = Math.max(y, boxTop + 74) + 14;

  // Meta row: Attention / Account / Sales Exec / Currency / Terms / Date
  doc.setDrawColor(20,20,20);
  doc.line(marginX, y, rightX, y);
  y += 14;
  const metaColW = (rightX - marginX) / 6;
  const metaCols = [
    ['Attention', meta.attention || '-'],
    ['Customer Account', meta.accountNo || '-'],
    ['Sales Executive', meta.salesExec || '-'],
    ['Currency', meta.currency],
    ['Terms', meta.terms],
    ['Date', new Date().toLocaleDateString('en-GB')],
  ];
  doc.setFontSize(8);
  metaCols.forEach((col, i)=>{
    const cx = marginX + i*metaColW;
    doc.setFont('helvetica','bold');
    doc.text(col[0], cx, y);
    doc.setFont('helvetica','normal');
    doc.text(String(col[1]), cx, y + 11);
  });
  y += 22;
  doc.line(marginX, y, rightX, y);
  y += 18;

  // Transaction table
  const colX = { date: marginX, ref: marginX+75, desc: marginX+155, debit: marginX+330, credit: marginX+400, balance: marginX+470 };
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.text('Date', colX.date, y);
  doc.text('Reference', colX.ref, y);
  doc.text('Description', colX.desc, y);
  doc.text('Debit', colX.debit, y, {align:'right'});
  doc.text('Credit', colX.credit, y, {align:'right'});
  doc.text('Balance', colX.balance, y, {align:'right'});
  y += 6;
  doc.line(marginX, y, rightX, y);
  y += 14;

  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);
  rows.forEach(r=>{
    if(y > 740){
      doc.addPage();
      y = 56;
    }
    doc.text(fmtDate(r.date) + ' ' + new Date(r.date).getFullYear(), colX.date, y);
    doc.text(r.reference || '', colX.ref, y);
    doc.text(r.description, colX.desc, y);
    if(r.debit) doc.text(Number(r.debit).toLocaleString('en-US',{minimumFractionDigits:2}), colX.debit, y, {align:'right'});
    if(r.credit) doc.text(Number(r.credit).toLocaleString('en-US',{minimumFractionDigits:2}), colX.credit, y, {align:'right'});
    doc.text(Number(r.balance).toLocaleString('en-US',{minimumFractionDigits:2}), colX.balance, y, {align:'right'});
    y += 16;
  });

  y += 8;
  if(y > 740){ doc.addPage(); y = 56; }
  doc.line(marginX, y, rightX, y);
  y += 16;

  // Amount in words + closing balance
  doc.setFontSize(8.5);
  doc.setFont('helvetica','normal');
  doc.text(`${meta.currency} MALAYSIA: ${numberToWordsMYR(closingBalance)}`, marginX, y);
  doc.setFont('helvetica','bold');
  doc.text(`${meta.currency}: ${closingBalance.toLocaleString('en-US',{minimumFractionDigits:2})}`, rightX, y, {align:'right'});
  y += 24;

  // Monthly summary boxes
  if(y > 700){ doc.addPage(); y = 56; }
  const monthColW = (rightX - marginX) / monthly.length;
  doc.setDrawColor(120,120,120);
  doc.setLineWidth(0.75);
  monthly.forEach((m,i)=>{
    doc.rect(marginX + i*monthColW, y, monthColW, 20);
  });
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  monthly.forEach((m,i)=>{
    doc.text(m.label, marginX + i*monthColW + monthColW/2, y + 13, {align:'center'});
  });
  y += 20;
  monthly.forEach((m,i)=>{
    doc.rect(marginX + i*monthColW, y, monthColW, 20);
  });
  doc.setFont('helvetica','normal');
  monthly.forEach((m,i)=>{
    doc.text(m.total ? Number(m.total).toLocaleString('en-US',{minimumFractionDigits:2}) : '-', marginX + i*monthColW + monthColW/2, y + 13, {align:'center'});
  });
  y += 32;

  doc.setFontSize(8);
  doc.setTextColor(80,80,80);
  const footNote = 'We shall be grateful if you will let us have payment as soon as possible. Any discrepancy in this statement must be reported to us in writing within 10 days.';
  const footLines = doc.splitTextToSize(footNote, rightX - marginX);
  doc.text(footLines, marginX, y);
  y += footLines.length * 11 + 16;

  // Bank details footer
  if(y > 740){ doc.addPage(); y = 56; }
  doc.setDrawColor(210,205,190);
  doc.setLineWidth(0.75);
  doc.line(marginX, y, rightX, y);
  y += 18;
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(20,20,20);
  doc.text('Payment Details', marginX, y);
  y += 14;
  doc.setFont('helvetica','normal');
  const ciFooter = state.companyInfo;
  if(ciFooter.bankAccountName){ doc.text(`Account Name   : ${ciFooter.bankAccountName}`, marginX, y); y += 13; }
  if(ciFooter.bankName){ doc.text(`Bank                 : ${ciFooter.bankName}`, marginX, y); y += 13; }
  if(ciFooter.bankAccountNumber){ doc.text(`Account Number : ${ciFooter.bankAccountNumber}`, marginX, y); y += 13; }

  const safeDealer = dealer.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  const filename = `statement-${safeDealer}-${new Date().toISOString().slice(0,10)}.pdf`;

  function savePdf(){
    try{
      doc.save(filename);
      showStatementStatus('PDF downloaded — check your downloads, then share it via WhatsApp from there.');
    }catch(err){
      showStatementStatus('Could not save the PDF. Please try again.');
    }
  }

  if(mode === 'share' && navigator.canShare){
    const blob = doc.output('blob');
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare({files:[file]})){
      navigator.share({
        files:[file],
        title: `Statement for ${dealer}`,
        text: `Statement for ${dealer} — ${currentLedger().name}`
      }).catch(()=>{
        savePdf();
      });
      return;
    }
  }
  await savePdf();
  }catch(err){
    showStatementStatus('Something went wrong generating the PDF: ' + (err && err.message ? err.message : 'unknown error'));
  }
}

loadState();
</script>
</body>
</html>
